<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web3 Insight Hub</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f172a;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --card: #111827;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 60%);
      color: var(--text);
      padding: 2rem;
    }

    .card {
      width: min(720px, 100%);
      background: color-mix(in hsl, var(--card), black 10%);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.1;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 0;
    }

    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      color: #0f172a;
      background: var(--accent);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Live</span>
    <h1>Web3 Insight Hub</h1>
    <p>
      Your GitHub Pages site is now configured and deploying from this repository.
      Replace this starter page with your dashboard, docs, or app frontend.
    </p>
  </main>
</body>
</html>
